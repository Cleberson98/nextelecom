<style>

.view-switch:hover{background:#faebed}
.view-switch svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.view-area{position:relative}
[hidden]{display:none!important}
.visually-hidden{position:absolute!important;overflow:hidden;clip-path:inset(50%);height:1px;width:1px;white-space:nowrap}

:root{--accent:#233971;--pale:#eef2fa}
body{background:#f9fafc}

.source-visual{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:430px;min-width:0;overflow:hidden;padding:18px 18px 42px;background:linear-gradient(135deg,#fff 0%,var(--pale) 100%);border:1px solid #e7ebf1;border-radius:25px}
.source-screen{display:block;max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;filter:drop-shadow(0 8px 9px #00000012);border-radius:8px}
.zoom-caption{position:absolute;right:14px;bottom:11px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:650;background:#ffffffd9;padding:6px 10px;border-radius:999px;color:#405070}
.zoom-caption svg{height:16px;width:16px;fill:none;stroke:currentColor;stroke-width:1.8}
.source-visual:hover .zoom-caption{background:var(--accent);color:#fff}
.visual-strip{color:var(--accent)}
.nav-btn.prev{border-color:var(--accent);color:var(--accent)}
.nav-btn.next:hover{background:color-mix(in srgb,var(--accent) 88%,black)}
.pager button[aria-current="step"]{background:var(--accent)}
.progress-counter{display:none}.skip-step{align-self:flex-start;background:white;color:var(--accent);border:1px solid var(--accent);border-radius:12px;margin-top:16px;padding:11px 14px;font-weight:750;font-size:13px}
.route-selector{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0 5px;max-width:75%}
.route-choice{border:1px solid #dbe1e9;border-radius:999px;background:#fff;padding:11px 17px;color:#43516a;font-size:13px;font-weight:750}
.route-choice[aria-pressed=true]{background:var(--accent);color:white;border-color:var(--accent)}
.route-name{color:var(--accent);font-weight:750}
.bottom-utilities{align-items:flex-start;line-height:1.6}
.overview-copy{font-size:12.5px;line-height:1.6;color:#66717e}
.overview-photo img{max-width:94%;max-height:90%;width:auto;height:auto;border-radius:5px}
.overview-heading:focus,#step-title:focus{outline:none}
.image-dialog{width:min(1180px,calc(100% - 28px));max-height:94dvh;padding:55px 18px 18px;border:0;border-radius:24px;background:white;box-shadow:0 20px 120px #0005}
.image-dialog::backdrop{background:#111b38b3;backdrop-filter:blur(4px)}
.image-dialog img{display:block;max-width:100%;max-height:calc(90dvh - 70px);width:auto;height:auto;object-fit:contain;margin:auto}
.dialog-close{position:absolute;top:12px;right:14px;border:1px solid #dbe1e9;background:white;padding:9px 15px;border-radius:999px;font-weight:750;color:var(--navy)}
.noscript{background:#fff7e8;color:#694a19;padding:14px;border-radius:12px;margin:20px auto;max-width:960px}
@media(min-width:1280px){.source-visual{height:440px}}
@media(max-width:1050px){.source-visual{height:385px}.hero-art{width:31%}.hero-art img{height:110px;width:110px}.hero-desc{max-width:68%}.hero h1{max-width:75%}}
@media(max-width:750px){
 .hero-inner{min-height:255px;padding-bottom:25px}.hero-art{display:none}.hero h1,.hero-desc{max-width:100%}.hero h1{font-size:34px}.hero-desc{font-size:14px}
 .brand-row{margin-bottom:20px}.service-logo{width:45px;height:45px;border-radius:11px}.logo-nex{width:135px}.brand-divider{height:31px}
 .all-guides{font-size:10px;right:0;top:23px;padding:8px 10px}
 .timeline{display:flex;padding:4px 13px 9px;gap:0}.timeline-card{padding-top:16px}.stage-tab{flex:0 0 84px}.stage-text{font-size:10px}.stage-number{height:35px;width:35px}
 .detail-panel{display:flex;flex-direction:column;padding:23px 17px 17px;gap:17px;min-height:0}.panel-info h2{font-size:29px;line-height:1.14}.panel-copy{font-size:14px;line-height:1.65}
 .source-visual{height:365px;padding:15px 10px 39px;border-radius:20px}.stage-visual{gap:10px}.visual-strip{font-size:11px}.tip{font-size:12px}
 .site-link{font-size:12px;padding:10px 12px}.step-links{margin-top:8px}.route-selector{max-width:100%;gap:6px}.route-choice{font-size:12px;padding:10px 13px}
 .footer-nav{gap:9px}.nav-btn{padding:14px 15px;font-size:13px;min-height:45px}.pager{flex-shrink:1}.pager.long{display:none}.progress-counter.long{display:block;font-size:12px;font-weight:700;color:#6c7886}
 .bottom-utilities{font-size:10px;gap:8px}.utility-link{font-size:11px}.overview-copy{font-size:11px}.overview-photo{height:180px}
 .overview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.overview-title{font-size:12px;min-height:50px}.image-dialog{border-radius:18px}
}
@media(max-width:375px){.hero h1{font-size:30px}.source-visual{height:320px}.all-guides{padding:8px;font-size:9px}.logo-nex{width:120px}.service-logo{width:39px;height:39px}.brand-row{gap:8px}.nav-btn{font-size:12px;padding:13px 11px}.panel-info h2{font-size:27px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

 “Download ExitLag”.","tip":"O tutorial a seguir mostra a instalação no computador.","image":"assets/pagina-08.webp"},{"page":9,"short":"Baixe o instalador","title":"Baixe o instalador","copy":"Na página de download, clique novamente em “Download ExitLag”. O arquivo começará a ser baixado no seu PC.","tip":"Aguarde o navegador concluir o download.","image":"assets/pagina-09.webp"},{"page":10,"short":"Abra o arquivo","title":"Abra o arquivo baixado","copy":"Clique no arquivo do ExitLag para iniciar a instalação.","tip":"Localize o arquivo na área de downloads do navegador ou na pasta Downloads.","image":"assets/pagina-10.webp"},{"page":11,"short":"Avance com Next","title":"Avance na instalação","copy":"Na janela do instalador, clique em “Next” para seguir pelas etapas de instalação.","tip":"Acompanhe as instruções apresentadas pelo instalador.","image":"assets/pagina-11.webp"},{"page":12,"short":"Clique em Install","title":"Instale o programa","copy":"Na etapa de instalação, clique em “Install”.","tip":"Aguarde a conclusão antes de fechar a janela.","image":"assets/pagina-12.webp"},{"page":13,"short":"Finalize com Finish","title":"Finalize a instalação","copy":"Quando a instalação terminar, clique em “Finish”.","tip":"Depois, abra o ExitLag no computador.","image":"assets/pagina-13.webp"},{"page":14,"short":"Faça login","title":"Entre com sua conta","copy":"No ExitLag, informe seu e-mail e a senha criada no início deste passo a passo.","tip":"As credenciais são digitadas no próprio programa, não neste tutorial.","image":"assets/pagina-14.webp"},{"page":15,"short":"Aguarde carregar","title":"Aguarde o carregamento","copy":"Ao iniciar, o programa exibirá uma tela de carregamento. Aguarde a abertura da tela principal.","tip":"Mantenha sua conexão com a internet durante o carregamento.","image":"assets/pagina-15.webp"},{"page":16,"short":"Tudo pronto","title":"Seu ExitLag está pronto","copy":"Com a tela principal aberta, o ExitLag está pronto para ser utilizado.","tip":"Você concluiu as etapas de ativação e instalação apresentadas neste guia.","final":true,"image":"assets/pagina-16.webp"}]}]}</script><script>(() => {
  'use strict';
  const data = JSON.parse(document.getElementById('tutorial-data').textContent);
  const $ = id => document.getElementById(id);
  const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const external = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h7v7m0-7-9 9M19 13v6H5V5h6"/></svg>';
  let routeIndex = 0, current = 0, overview = false, touchStart = null;
  const route = () => data.routes[routeIndex];
  const steps = () => route().steps;
  function readHash() {
    const match = location.hash.slice(1).match(/^([^/]+)\/(\d+)$/);
    if (!match) return;
    const idx = data.routes.findIndex(r => r.id === match[1]);
    if (idx >= 0) { routeIndex = idx; current = Math.max(0, Math.min(data.routes[idx].steps.length - 1, Number(match[2]) - 1)); }
  }
  function setHash() {
    const hash = `#${route().id}/${current + 1}`;
    try { history.replaceState(null, '', hash); } catch (_) { /* file previews still work without history access */ }
  }
  function staticView() {
    const list = steps();
    $('timeline').style.setProperty('--count', list.length);
    $('timeline-card').style.setProperty('--count', list.length);
    $('timeline').innerHTML = list.map((s,i) => `<button class="stage-tab" data-step="${i}" type="button" aria-label="Etapa ${i+1}: ${esc(s.short)}"><span class="stage-number">${i+1}</span><span class="stage-text">${esc(s.short)}</span></button>`).join('');
    $('pager').classList.toggle('long', list.length > 8);
    $('pager').innerHTML = list.map((s,i) => `<button type="button" data-step="${i}" aria-label="Ir para etapa ${i+1}"></button>`).join('');
    $('overview-grid').innerHTML = list.map((s,i) => `<button type="button" class="overview-tile" data-step="${i}"><span class="overview-title"><span class="overview-index">${i+1}</span><span>${esc(s.short)}</span></span><span class="overview-photo"><img loading="lazy" src="${esc(s.image)}" alt="${esc(s.title)}" /></span><span class="overview-copy">${esc(s.copy)}</span></button>`).join('');
    document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.step))));
    $('route-selector').hidden = data.routes.length < 2;
    $('route-selector').innerHTML = data.routes.map((r,i) => `<button type="button" class="route-choice" data-route="${i}" aria-pressed="${i===routeIndex}">${esc(r.label)}</button>`).join('');
    document.querySelectorAll('[data-route]').forEach(b => b.addEventListener('click', () => { routeIndex = Number(b.dataset.route); current = 0; staticView(); go(0); }));
    $('route-name').textContent = route().label;
  }
  function render(focus = false) {
    const s = steps()[current], count = steps().length;
    const links = (s.links || []).map(link => `<a class="site-link" target="_blank" rel="noopener noreferrer" href="${esc(link.url)}">${esc(link.label)} ${external}</a>`).join('');
    $('panel-info').innerHTML = `<div class="step-chip">PASSO ${current+1} DE ${count}</div><h2 id="step-title" tabindex="-1">${esc(s.title)}</h2><p class="panel-copy">${esc(s.copy)}</p><div class="step-links">${links}</div><div class="tip"><span class="tip-icon" aria-hidden="true">${s.final ? '✓' : 'i'}</span><span>${esc(s.tip)}</span></div>${Number.isInteger(s.skipTo) ? `<button class="skip-step" type="button" id="skip-step">${esc(s.skipLabel)} →︎</button>` : ''}`;
    $('stage-visual').innerHTML = `<button type="button" class="source-visual" id="open-image" aria-label="Ampliar tela: ${esc(s.title)}"><img class="source-screen" src="${esc(s.image)}" alt="Tela de referência de ${esc(data.name)}: ${esc(s.title)}" draggable="false"><span class="zoom-caption"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6M10 7v6M7 10h6"/></svg>Ampliar tela</span></button><div class="visual-strip"><span class="symbol" aria-hidden="true">${s.final ? '✓' : current+1}</span><span>${esc(s.short)}</span></div>`;
    $('open-image').addEventListener('click', () => { $('zoomed-image').src = s.image; $('zoomed-image').alt = `Tela de ${data.name}: ${s.title}`; $('image-dialog').showModal(); });
    if ($('skip-step')) $('skip-step').addEventListener('click', () => go(s.skipTo));
    document.querySelectorAll('.stage-tab, #pager [data-step]').forEach(b => {
      const index = Number(b.dataset.step);
      b.classList.toggle('done', index < current);
      if (index === current) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    });
    $('timeline-fill').style.width = `${count < 2 ? 100 : current / (count-1) * 100}%`;
    $('prev').disabled = current === 0;
    $('next-label').textContent = current === count-1 ? 'Recomeçar' : 'Próximo';
    $('announce').textContent = `Etapa ${current+1} de ${count}: ${s.title}`;
    $('progress-text').textContent = `${current+1} / ${count}`;
    $('detail-panel').dataset.currentStep = current + 1;
    $('detail-panel').dataset.route = route().id;
    for (const id of ['panel-info','stage-visual']) { const el = $(id); el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); }
    const tab = $('timeline').querySelector(`[data-step="${current}"]`);
    const target = tab.offsetLeft - $('timeline').clientWidth/2 + tab.offsetWidth/2;
    $('timeline').scrollTo({left: Math.max(0,target), behavior: reduce ? 'auto' : 'smooth'});
    setHash();
    if (focus) $('step-title').focus({preventScroll:true});
  }
  function go(index) {
    current = Math.max(0, Math.min(steps().length-1,index));
    overview = false; $('overview-view').hidden = true; $('guided-view').hidden = false;
    render(true);
  }
  $('prev').addEventListener('click', () => go(current-1));
  $('next').addEventListener('click', () => go(current === steps().length-1 ? 0 : current+1));
  $('show-overview').addEventListener('click', () => {
    overview = true; $('guided-view').hidden = true; $('overview-view').hidden = false;
    $('overview-heading').focus({preventScroll:true});
    $('announce').textContent = `Visão geral: ${steps().length} etapas`;
  });
  $('back-overview').addEventListener('click', () => go(current));
  $('close-image').addEventListener('click', () => $('image-dialog').close());
  $('image-dialog').addEventListener('click', event => { if (event.target === $('image-dialog')) $('image-dialog').close(); });
  window.addEventListener('hashchange', () => { readHash(); staticView(); go(current); });
  window.addEventListener('keydown', e => {
    if ($('image-dialog').open || ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)) return;
    if (overview) { if(e.key === 'Escape') go(current); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); go(current+1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(current-1); }
  });
  $('detail-panel').addEventListener('touchstart', e => { if (e.touches.length === 1) touchStart = [e.touches[0].clientX,e.touches[0].clientY]; }, {passive:true});
  $('detail-panel').addEventListener('touchend', e => {
    if (!touchStart || !e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX-touchStart[0], dy = e.changedTouches[0].clientY-touchStart[1]; touchStart = null;
    if (Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.8) go(current+(dx<0?1:-1));
  }, {passive:true});
  readHash(); staticView(); render();
})();
</script></body></html>
